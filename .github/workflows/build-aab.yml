name: Build TWA AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PWA_URL: https://misty-lens-duel-pro.base44.app
      PACKAGE_ID: com.lensduel.myapp
      APP_NAME: LensDuel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK (cmdline tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip
          rm cmdline-tools.zip
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          yes | $HOME/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-33" "build-tools;33.0.2" "platform-tools" "extras;android;m2repository" "extras;google;m2repository"
        shell: bash

      - name: Add Android SDK to PATH
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/cmdline-tools/cmdline-tools/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create TWA project directory
        run: mkdir -p twa

      - name: Initialize TWA project with Bubblewrap
        working-directory: twa
        run: |
          # Use the PWA manifest hosted on the site. Skip prompts for CI.
          bubblewrap init --manifest "$PWA_URL/manifest.json" --packageId $PACKAGE_ID --applicationName "$APP_NAME" --skipPrompts

      - name: Restore keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/twa/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build TWA AAB (release)
        working-directory: twa
        run: |
          set -e
          # Build and sign using the provided keystore secrets
          bubblewrap build --keystore "$GITHUB_WORKSPACE/twa/release.jks" --keystoreAlias ${{ secrets.KEY_ALIAS }} --keystorePassword "${{ secrets.KEYSTORE_PASSWORD }}" --keyPassword "${{ secrets.KEY_PASSWORD }}" --outputDirectory output

      - name: List output files
        working-directory: twa
        run: ls -la output || true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.lensduel.myapp.aab
          path: twa/output/app-release.aab
